# Shared Compound Engineering settings for this repository.

autonomous_profile: hands-off
autonomous_motions: [main-red, backlog, stack, climb]
autonomous_landing: pull-request
autonomous_ci: required
autonomous_merge_method: squash
autonomous_landing_steps:
  - Keep each change focused, explain the user-facing outcome, and include tests for behavior changes.
autonomous_checks:
  - run: npm ci --no-audit --no-fund && npm run check
  - run: bundle install --quiet && bin/rubocop
  - run: bundle install --quiet && bin/brakeman --no-pager
  - run: bundle install --quiet && bundle exec bundle-audit update --quiet && bin/bundler-audit
  - run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=moderate
  - run: export TMPDIR=$(mktemp -d /tmp/tr.XXXXXX) RAILS_ENV=development PLAYWRIGHT_SKIP_BROWSER_GC=1 THINKROOM_DOC_CREATION_BURST=500 THINKROOM_DOC_CREATION_DAILY=500 COMPOUND_WRITING_FAKE_JUDGE=1 && trap 'rm -rf "$TMPDIR"' EXIT && free() { python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1])'; } && export PORT=$(free) VITE_RUBY_PORT=$(free) && export BASE_URL=http://localhost:$PORT && bundle install --quiet && npm ci --no-audit --no-fund && npx playwright install chromium && bin/rails db:prepare db:seed && bin/rails "compound_writing:check_account[compound-check@example.com,thoughtful-passphrase]" && { bin/vite dev > "$TMPDIR/vite.log" 2>&1 & } && { bin/rails server -p $PORT -P "$TMPDIR/pid" > "$TMPDIR/rails.log" 2>&1 & } && for i in $(seq 1 90); do curl -fso /dev/null $BASE_URL/up && break; sleep 1; done && node -e 'const{chromium}=require("playwright");(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto(process.env.BASE_URL+"/d/demo",{timeout:180000,waitUntil:"networkidle"});await b.close()})()' && for c in sync_check link_check mermaid_check rich_block_width_check long_document_check document_size_check suggestion_list_replace_check export_check html_document_check highlighter_check meta_refresh_check mobile_zoom_check native_shell_check webmcp_check compound_writing_check browser_check; do node script/$c.mjs || exit 1; done
    paths: app/frontend/** app/channels/** script/** package.json package-lock.json Gemfile.lock
  - run: export TMPDIR=$(mktemp -d /tmp/tr.XXXXXX) RAILS_ENV=test && trap 'rm -rf "$TMPDIR"' EXIT && bundle install --quiet && npm ci --no-audit --no-fund && bin/vite build --mode test && bin/rails db:test:prepare test
